<div class="detail-page">
  <!-- Header -->
  <div class="detail-header">
    <div class="detail-header__left">
      <a mat-icon-button routerLink="/admin/schools" matTooltip="Quay lại danh sách">
        <mat-icon>arrow_back</mat-icon>
      </a>
      <h2 class="detail-header__title">
        {{ isEditMode() ? 'Chỉnh sửa trường học' : 'Thêm trường mới' }}
      </h2>
    </div>
    @if (isEditMode()) {
      <a mat-stroked-button [routerLink]="['/admin/schools', schoolId(), 'classes']">
        <mat-icon>school</mat-icon> Xem lớp học
      </a>
    }
  </div>

  <!-- Form -->
  <div class="form-card">
    <form [formGroup]="schoolForm" (ngSubmit)="onSubmit()">
      <div class="form-grid">
        <mat-form-field appearance="outline">
          <mat-label>Tên trường</mat-label>
          <input matInput formControlName="name" placeholder="Ví dụ: THPT Chu Văn An" required />
          <mat-error>Tên trường là bắt buộc</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Mã trường</mat-label>
          <input matInput formControlName="code" placeholder="Ví dụ: CVAN" required />
          <mat-error>Mã trường là bắt buộc</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Địa chỉ</mat-label>
          <input matInput formControlName="address" placeholder="Số nhà, đường, phường/xã..." />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Số điện thoại</mat-label>
          <input matInput formControlName="phone" placeholder="024xxxxxxx" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" placeholder="school@example.com" />
          <mat-error>Email không hợp lệ</mat-error>
        </mat-form-field>
      </div>

      <div class="form-actions">
        <button
          mat-flat-button
          color="primary"
          type="submit"
          [disabled]="schoolForm.invalid || saving()"
        >
          @if (saving()) {
            <mat-spinner diameter="18" />
          } @else {
            <mat-icon>save</mat-icon>
          }
          {{ isEditMode() ? 'Cập nhật' : 'Tạo mới' }}
        </button>

        @if (isEditMode()) {
          <button mat-stroked-button color="warn" type="button" (click)="onDelete()">
            <mat-icon>delete</mat-icon> Xóa trường
          </button>
        }
      </div>
    </form>
  </div>
</div>
