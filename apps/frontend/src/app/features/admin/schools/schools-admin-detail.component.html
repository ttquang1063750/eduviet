<div class="detail-page">
  <!-- Header -->
  <div class="detail-header">
    <div class="detail-header__left">
      <a mat-icon-button routerLink="/admin/schools" i18n-matTooltip matTooltip="Quay lại danh sách">
        <mat-icon>arrow_back</mat-icon>
      </a>
      <h2 class="detail-header__title">
        @if (isEditMode()) {
          <span i18n>Chỉnh sửa trường học</span>
        } @else {
          <span i18n>Thêm trường mới</span>
        }
      </h2>
    </div>
    @if (isEditMode()) {
      <a mat-stroked-button [routerLink]="['/admin/schools', schoolId(), 'classes']">
        <mat-icon>school</mat-icon> <span i18n>Xem lớp học</span>
      </a>
    }
  </div>

  <!-- Form -->
  <div class="form-card">
    <form [formGroup]="schoolForm" (ngSubmit)="onSubmit()">
      <div class="form-grid">
        <mat-form-field appearance="outline">
          <mat-label i18n>Tên trường</mat-label>
          <input matInput formControlName="name" i18n-placeholder placeholder="Ví dụ: THPT Chu Văn An" required />
          <mat-error i18n>Tên trường là bắt buộc</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label i18n>Mã trường</mat-label>
          <input matInput formControlName="code" i18n-placeholder placeholder="Ví dụ: CVAN" required />
          <mat-error i18n>Mã trường là bắt buộc</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label i18n>Địa chỉ</mat-label>
          <input matInput formControlName="address" i18n-placeholder placeholder="Số nhà, đường, phường/xã..." />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label i18n>Số điện thoại</mat-label>
          <input matInput formControlName="phone" i18n-placeholder placeholder="024xxxxxxx" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label i18n>Email</mat-label>
          <input matInput type="email" formControlName="email" i18n-placeholder placeholder="school@example.com" />
          <mat-error i18n>Email không hợp lệ</mat-error>
        </mat-form-field>
      </div>

      <div class="form-actions">
        <button
          mat-flat-button
          color="primary"
          type="submit"
          [disabled]="schoolForm.invalid || saving()"
        >
          @if (saving()) {
            <mat-spinner diameter="18" />
          } @else {
            <mat-icon>save</mat-icon>
          }
          @if (isEditMode()) {
            <span i18n>Cập nhật</span>
          } @else {
            <span i18n>Tạo mới</span>
          }
        </button>

        @if (isEditMode()) {
          <button mat-stroked-button color="warn" type="button" (click)="onDelete()">
            <mat-icon>delete</mat-icon> <span i18n>Xóa trường</span>
          </button>
        }
      </div>
    </form>
  </div>
</div>
